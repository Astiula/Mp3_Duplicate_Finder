name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "mp3_duplikaty_paczka" | Out-Null
          Copy-Item "source/mp3_duplikaty.py" "mp3_duplikaty_paczka/mp3_duplikaty.py"
          @'
          MP3 DUPLIKATY - instrukcja
          ==========================

          Program dla Windows 10/11 do wyszukiwania identycznych plików MP3 i
          podobnych nagrań po ponownym kodowaniu z użyciem Chromaprint.

          Użycie:
          1. Uruchom Mp3_Duplicate_Finder.exe.
          2. Wybierz folder z muzyką.
          3. Ustaw próg zgodności fingerprintu (domyślnie 0.82).
          4. Kliknij Skanuj MP3.
          5. Zaznacz wyniki do przeniesienia lub wyeksportuj raport CSV.

          Program ma jasny i ciemny motyw (wybor zapamietywany automatycznie)
          oraz okno O programie z informacja o autorze i licencjach.

          Program nie usuwa plikow automatycznie. Przenoszenie wymaga
          zaznaczenia plikow i potwierdzenia. Wyniki podobienstwa nalezy
          zweryfikowac przed przeniesieniem.
          '@ | Set-Content -Encoding utf8 "mp3_duplikaty_paczka/README.txt"

      - name: Download and verify Chromaprint fpcalc
        shell: pwsh
        run: |
          $url = "https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile fpcalc.zip
          $hash = (Get-FileHash fpcalc.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e") { throw "Chromaprint checksum mismatch" }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc
          $fp = Get-ChildItem fpcalc -Filter fpcalc.exe -Recurse | Select-Object -First 1
          if (!$fp) { throw "fpcalc.exe not found" }
          Copy-Item $fp.FullName "mp3_duplikaty_paczka/fpcalc.exe"

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri "$url.sha256" -OutFile ffmpeg.sha256
          $expected = ((Get-Content ffmpeg.sha256 -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) { throw "FFmpeg checksum mismatch" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $ff = Get-ChildItem ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ff) { throw "ffmpeg.exe not found" }
          Copy-Item $ff.FullName "mp3_duplikaty_paczka/ffmpeg.exe"
          $lic = Get-ChildItem ffmpeg_extract -Filter "LICENSE*" -Recurse | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "mp3_duplikaty_paczka/FFMPEG_LICENSE.txt" }
          else { Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3" -OutFile "mp3_duplikaty_paczka/FFMPEG_LICENSE.txt" }

      - name: Add third-party notices
        shell: pwsh
        run: |
          @'
          Third-party components included in the Windows build:

          FFmpeg Windows essentials build by Gyan Doshi
          Distribution page: https://www.gyan.dev/ffmpeg/builds/
          Build archive: ffmpeg-release-essentials.zip
          The Gyan essentials build is GPLv3. Build/source details: https://www.gyan.dev/ffmpeg/builds/
          FFmpeg legal information: https://ffmpeg.org/legal.html

          Chromaprint / fpcalc 1.6.1
          Project: https://github.com/acoustid/chromaprint
          License: LGPL-2.1 (Chromaprint source also includes MIT-licensed portions)
          License text: https://github.com/acoustid/chromaprint/blob/v1.6.1/LICENSE.md
          Release: https://github.com/acoustid/chromaprint/releases/tag/v1.6.1

          Application source:
          Copyright © 2026 Konrad Astachow (Kondar), all rights reserved.
          Application source is proprietary; this notice does not change the
          separate licenses applicable to FFmpeg and Chromaprint.
          '@ | Set-Content -Encoding utf8 "mp3_duplikaty_paczka/THIRD_PARTY_NOTICES.txt"

      - name: Include Chromaprint license and app notice
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/acoustid/chromaprint/v1.6.1/LICENSE.md" -OutFile "mp3_duplikaty_paczka/CHROMAPRINT_LICENSE.txt"
          @'
          Mp3 Duplicate Finder
          Copyright © 2026 Konrad Astachow (Kondar). All rights reserved.

          The application source is proprietary. No open-source license is
          granted for the application source by this notice.

          Third-party components are separately licensed:
          - FFmpeg Windows essentials build: GPLv3
          - Chromaprint / fpcalc 1.6.1: LGPL-2.1, with MIT-licensed portions
          See THIRD_PARTY_NOTICES.txt and the accompanying component license
          files for details.
          '@ | Set-Content -Encoding utf8 "mp3_duplikaty_paczka/APP_LICENSE.txt"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller mutagen

      - name: Add version metadata
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          @'
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=(1, 2, 0, 0), prodvers=(1, 2, 0, 0),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'Konrad Astachow (Kondar)'),
                StringStruct('FileDescription', 'MP3 Duplicate Finder'),
                StringStruct('FileVersion', '1.2.0'),
                StringStruct('InternalName', 'Mp3_Duplicate_Finder'),
                StringStruct('OriginalFilename', 'Mp3_Duplicate_Finder.exe'),
                StringStruct('ProductName', 'MP3 Duplicate Finder'),
                StringStruct('ProductVersion', '1.2.0'),
                StringStruct('LegalCopyright', 'Copyright 2026 Konrad Astachow (Kondar)')
              ])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          '@ | Set-Content -Encoding utf8 "version_info.txt"
          pyinstaller --noconfirm --clean --onedir --windowed --noupx --name Mp3_Duplicate_Finder --version-file version_info.txt --add-binary "ffmpeg.exe;." --add-binary "fpcalc.exe;." mp3_duplikaty.py
          if (!(Test-Path "dist/Mp3_Duplicate_Finder/Mp3_Duplicate_Finder.exe")) { throw "EXE build failed" }

      - name: Check executable and create checksums
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          $root = (Resolve-Path "dist/Mp3_Duplicate_Finder").Path
          $exe = Join-Path $root "Mp3_Duplicate_Finder.exe"
          if ((Get-Item $exe).Length -lt 1000000) { throw "Executable unexpectedly small" }
          Get-ChildItem $root -File -Recurse | Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Substring($root.Length + 1))" } |
            Set-Content -Encoding ascii (Join-Path $root "SHA256SUMS.txt")

      - name: Optional Authenticode signing
        if: ${{ env.SIGN_CERT != '' && env.SIGN_PASSWORD != '' }}
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $bytes)
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName.Contains('\\x64\\signtool.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/Mp3_Duplicate_Finder/Mp3_Duplicate_Finder.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          & $signtool.FullName verify /pa /v "dist/Mp3_Duplicate_Finder/Mp3_Duplicate_Finder.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed" }

      - name: Package application and notices
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          Copy-Item README.txt, THIRD_PARTY_NOTICES.txt, FFMPEG_LICENSE.txt, CHROMAPRINT_LICENSE.txt, APP_LICENSE.txt dist/Mp3_Duplicate_Finder/
          @'
          SECURITY AND VERIFICATION
          Download only from the official GitHub repository Actions artifact.
          Verify files against SHA256SUMS.txt before running.
          No services, drivers, scheduled tasks or startup entries are installed.
          File moving requires an explicit user action in the application.
          Third-party component licenses are included in this folder.
          An unsigned build may still trigger SmartScreen due to lack of publisher reputation.
          '@ | Set-Content -Encoding utf8 dist/Mp3_Duplicate_Finder/SECURITY.txt

      - name: Upload Windows application package
        uses: actions/upload-artifact@v7
        with:
          name: Mp3_Duplicate_Finder-Windows-x64
          path: mp3_duplikaty_paczka/dist/Mp3_Duplicate_Finder/
          if-no-files-found: error
          retention-days: 30

      - name: Build standalone single-file EXE
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          $ffmpeg = (Resolve-Path "ffmpeg.exe").Path
          $fpcalc = (Resolve-Path "fpcalc.exe").Path
          $versionInfo = (Resolve-Path "version_info.txt").Path
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name Mp3_Duplicate_Finder_Portable --version-file "$versionInfo" --distpath dist-portable --workpath build-portable --specpath spec-portable --add-binary "$ffmpeg;." --add-binary "$fpcalc;." mp3_duplikaty.py
          $exe = "dist-portable/Mp3_Duplicate_Finder_Portable.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw "Standalone EXE build failed" }
          Copy-Item README.txt, THIRD_PARTY_NOTICES.txt, FFMPEG_LICENSE.txt, CHROMAPRINT_LICENSE.txt, APP_LICENSE.txt dist-portable/
          @'
          STANDALONE WINDOWS EXECUTABLE
          This is a single-file PyInstaller build. It extracts bundled runtime
          components to a temporary directory when launched.
          The executable is unsigned unless a trusted Authenticode certificate
          has been configured in the repository secrets.
          '@ | Set-Content -Encoding utf8 dist-portable/SECURITY.txt
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Mp3_Duplicate_Finder_Portable.exe" | Set-Content -Encoding ascii dist-portable/SHA256SUMS.txt

      - name: Upload standalone single-file EXE
        uses: actions/upload-artifact@v7
        with:
          name: Mp3_Duplicate_Finder-Standalone-EXE
          path: mp3_duplikaty_paczka/dist-portable/
          if-no-files-found: error
          retention-days: 30

