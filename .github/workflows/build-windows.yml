name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up 7-Zip
        uses: milliewt/setup-7zip@v1

      - name: Extract project source
        shell: pwsh
        run: |
          Expand-Archive -Path "source/MP3_Duplikaty_paczka.zip" -DestinationPath .
          if (!(Test-Path "mp3_duplikaty_paczka/mp3_duplikaty.py")) { throw "Missing application source" }

      - name: Download Chromaprint fpcalc
        shell: pwsh
        run: |
          $url = "https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile fpcalc.zip
          $hash = (Get-FileHash fpcalc.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e") { throw "Chromaprint checksum mismatch" }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc
          $fp = Get-ChildItem fpcalc -Filter fpcalc.exe -Recurse | Select-Object -First 1
          if (!$fp) { throw "fpcalc.exe not found" }
          Copy-Item $fp.FullName "mp3_duplikaty_paczka/fpcalc.exe"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_extract -y | Out-Null
          $ff = Get-ChildItem ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ff) { throw "ffmpeg.exe not found" }
          Copy-Item $ff.FullName "mp3_duplikaty_paczka/ffmpeg.exe"
          Copy-Item (Join-Path $ff.Directory.FullName "LICENSE.txt") "mp3_duplikaty_paczka/FFMPEG_LICENSE.txt" -ErrorAction SilentlyContinue

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build one-file executable
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Mp3_Duplicate_Finder --add-binary "ffmpeg.exe;." --add-binary "fpcalc.exe;." mp3_duplikaty.py
          if (!(Test-Path "dist/Mp3_Duplicate_Finder.exe")) { throw "EXE build failed" }

      - name: Smoke test executable
        shell: pwsh
        working-directory: mp3_duplikaty_paczka
        run: |
          $exe = Resolve-Path "dist/Mp3_Duplicate_Finder.exe"
          if ((Get-Item $exe).Length -lt 1000000) { throw "Executable unexpectedly small" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Mp3_Duplicate_Finder-Windows-x64
          path: |
            mp3_duplikaty_paczka/dist/Mp3_Duplicate_Finder.exe
            mp3_duplikaty_paczka/README.txt
            mp3_duplikaty_paczka/FFMPEG_LICENSE.txt
          if-no-files-found: warn
          retention-days: 30
